name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      execute_notebooks:
        description: Re-execute all documentation notebooks and upload refreshed results
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: MkDocs and saved notebook results
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt
      - name: Check saved notebook results
        run: python scripts/docs_notebooks.py --check
      - name: Test documentation checks
        run: |
          python -m unittest discover -s scripts/tests
          node scripts/tests/test_notebook_copy.mjs
      - name: Build documentation
        run: python -m mkdocs build --strict
      - name: Check generated pages and links
        run: python scripts/check_docs.py site
      - uses: actions/upload-artifact@v4
        with:
          name: documentation-site
          path: site

  notebooks:
    name: Refresh notebook outputs (manual)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.execute_notebooks }}
    runs-on: ubuntu-latest
    env:
      NKDSL_EXPERIMENTAL: "1"
      NETKET_EXPERIMENTAL: "1"
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            docs/requirements.txt
            docs/requirements-notebooks.txt
      - name: Install notebook runtime
        run: python -m pip install -r docs/requirements-notebooks.txt
      - name: Execute notebooks
        run: python scripts/docs_notebooks.py --execute --force
      - name: Verify refreshed documentation
        run: |
          python -m mkdocs build --strict
          python scripts/check_docs.py site
      - uses: actions/upload-artifact@v4
        with:
          name: executed-notebooks
          path: |
            docs/*.ipynb
            docs/tutorials/*.ipynb
            docs/advanced_tutorials/*.ipynb
            scripts/notebook-results.json
